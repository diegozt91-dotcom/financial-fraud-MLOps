services:
  # Coordinador de Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: tfm-zookeeper-1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - tfm-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Motor de mensajería en tiempo real
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: tfm-kafka-1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - tfm-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1.5G

  # Entorno Jupyter con PySpark
  pyspark-notebook:
    build: .
    image: mi-entorno-tfm:1.0
    container_name: tfm-pyspark-notebook-1
    user: root
    ports:
      - "8888:8888" 
      - "4040:4040"
      - "8501:8501"
      - "8050:8050"
    volumes:
      - .:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - SPARK_DRIVER_MEMORY=4g
      - SPARK_EXECUTOR_MEMORY=4g
      - PYTHONPATH=/usr/local/spark/python:/usr/local/spark/python/lib/py4j-0.10.9.7-src.zip
    networks:
      - tfm-network
    deploy:
      resources:
        limits:
          cpus: '6.0'  
          memory: 10G
networks:
  tfm-network:
    driver: bridge
